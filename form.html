<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form page for users to submit their reviews and ratings of products.">
    <meta name="author" content="Gad Cerda Lara">
    <title>Product review form</title>
    <!-- link to CSS file -->
    <link rel="stylesheet" href="styles/form.css">
    <!-- Link to a java file -->
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <!-- Name of the product -->
            <fieldset>
                <legend>Product Information</legend>
                
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <!-- General calification -->
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-group">
                    <label for="star1"><input type="radio" id="star1" name="rating" value="1" required> &star;</label>
                    <label for="star2"><input type="radio" id="star2" name="rating" value="2" required> &star;&star;</label>
                    <label for="star3"><input type="radio" id="star3" name="rating" value="3" required> &star;&star;&star;</label>
                    <label for="star4"><input type="radio" id="star4" name="rating" value="4" required> &star;&star;&star;&star;</label>
                    <label for="star5"><input type="radio" id="star5" name="rating" value="5" required> &star;&star;&star;&star;&star;</label>
                </div>
            </fieldset>

            <!-- installation date -->
            <fieldset>
                <legend>Installation Date</legend>
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </fieldset>

            <!-- useful features -->
            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label for="feature1">
                        <input type="checkbox" id="feature1" name="features" value="durability"> Durability
                    </label>
                    <label for="feature2">
                        <input type="checkbox" id="feature2" name="features" value="ease"> Ease of Use
                    </label>
                    <label for="feature3">
                        <input type="checkbox" id="feature3" name="features" value="performance"> Performance
                    </label>
                    <label for="feature4">
                        <input type="checkbox" id="feature4" name="features" value="design"> Design
                    </label>
                </div>
            </fieldset>

            <!-- Review -->
            <fieldset>
                <legend>Written Review</legend>
                <label for="writtenReview">Write your review (Optional):</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </fieldset>

            <!-- Name of user-->
            <fieldset>
                <legend>Your Information</legend>
                <label for="userName">User Name (Optional):</label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <!-- Button -->
            <div class="submit-box">
                <input type="submit" value="Post Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Gad Cerda Lara | Matamoros tamaulipas</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
