<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection / Catalog - New Vintage</title>
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/script_project.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="brand-logo">
            <img src="images/hero-vintage.jpeg" alt="New Vintage Logo" class="logo-img">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html" class="active">Collection / Catalog</a></li>
                <li><a href="references.html">References</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Authenticated collection</h2>
            <p>Explore our unique pieces of clothing, retro accessories, and historical decoration.</p>
            
            <!-- Contenedor dinámico controlado por JavaScript -->
            <div id="dynamic-container" class="grid-container"></div>
        </section>

        <section style="margin-top: 4rem;">
            <h2>Register as a Vintage Enthusiast</h2>
            <form id="user-form">
                <label for="username">Your Name:</label>
                <input type="text" id="username" required placeholder="e.g., Jhonny deep">

                <label for="preference">Favorite Interest Category:</label>
                <select id="preference" required>
                    <option value="">Select an option</option>
                    <option value="Vintage Clothing">Vintage Clothing</option>
                    <option value="Retro Accessories">Retro Accessories</option>
                    <option value="Historical Decoration">Historical Decoration</option>
                </select>

                <button type="submit">Save My Preferences</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 New Vintage. All rights reserved. <a href="references.html">View References</a></p>
    </footer>
</body>
</html>
